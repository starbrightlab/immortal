name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  portal-manager:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate scope, build, and tests
        run: ./macos/validate.sh check

      - name: Check offline Release verification tools
        run: ./macos/package-release.sh --check-tools

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run fleetctl tests
        run: cargo test --locked --manifest-path provisioning/Cargo.toml

      - name: Run background service tests
        run: cargo test --locked --manifest-path macos/BackgroundService/Cargo.toml

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Pin to platform-tools only. The action's default package set includes the
          # obsolete `tools` package, whose archive now fails to download ("Error on
          # ZipFile unknown archive") and breaks setup. `tools` isn't needed for unit tests.
          packages: platform-tools

      - name: Install compile SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null || true

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
